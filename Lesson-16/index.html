<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML Block, HTML Inline, HTML Inlin-Block</title>
    </head>
    <body>
        <!-- HTML Block -->
        <!-- 
        Block có thể hiểu theo nghĩa tiếng Việt là một khối.
        Trong HTML, Block là một kiểu hiển thị cho các Elements.
        Một Block sẽ bắt đầu trên một dòng mới, và mặc định chiếm 100% chiều rộng màn hình có sẵn.
        Block có thể thay đổi width - height thoải mái.
        Có 2 thẻ HTML phổ biến dạng Block thường được sử dụng là <div> và <p>
        Ngoài ra còn nhiều thẻ khác như: 
        <address> <article> <blockquote> <canvas> <dd> <dl> <dt> <footer> <form> <h1>-<h6> <header> <hr> <li> <main> <nav> <ol> <pre> <section> <table> <tfoot> <ul> <video>
    -->

        <!-- HTML Inline -->
        <!-- 
        Inline - nội tuyến: có thể hiểu đơn giản là ở trên cùng một hàng.
        Inline là một kiểu hiển thị cho các Elements.
        Inline không tạo dòng mới mà sẽ nối tiếp trên cùng dòng.
        Inline sẽ chiếm width - height đủ dùng (theo nội dung mà nó chứa bên trong) và không thể thay đổi.
        Thẻ HTML phổ biến nhật dạng Inline thường được sử dụng là <span>, <a>
        Ngoài ra còn nhiều thẻ khác như:
        Lưu ý: Code đúng chuẩn thì một phần tử dạng Inline không được phép chứa phần tử con dạng Block nhé.
        <a> <abbr> <b> <bdo> <br> <button> <cite> <code> <em> <i> <img> <input>  <label> <map> <object> <output> <q> <script> <select> <small> <strong> <sub> <sup> <textarea>
    -->

        <!-- HTML Inline-Block -->
        <!-- 
        Inline-block: Là một kiểu hiển thị kết hợp giữa block và inline.
        Phần tử có kiểu inline-block sẽ giữ đặc điểm của inline (hiển thị trên cùng một dòng), nhưng có thể điều chỉnh chiều rộng và chiều cao như một thẻ block. Ví dụ:
        <span style="display: inline-block; width: 500px;">TrungQuanDev</span>

        Note: Block thường được dùng để tạo thành phần có cấu trúc lớn, còn Inline thường dùng cho các thành phần nhỏ hơn cũng như không làm gián đoạn văn bản trên một dòng.     
    --></body>
</html>
