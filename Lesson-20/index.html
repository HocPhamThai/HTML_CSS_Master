<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML & Javascript - TrungQuanDev</title>
    </head>
    <body>
        <!-- Cách 1: sử dụng JS trực tiếp trong thẻ HTML: -->
        <button type="button" onclick="alert('ToiDepTrai')">Show my fact</button>

        <!-- Cách 2: sử dụng JS trong cặp thẻ <script> -->
        <div id="test"></div>
        <script>
            document.getElementById("test").innerHTML = "New thing come after!!!";
        </script>

        <!-- Cách 3: Sử dụng JS trong một file riêng -->
        <script src="./index.js"></script>
    </body>
</html>
