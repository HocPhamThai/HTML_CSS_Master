<!DOCTYPE html>
<html lang="en">
    <head>
        Khai báo bộ mã hóa ký tự chuẩn cho trang web:
        <meta charset="UTF-8" />
        Thẻ này chỉ thực sự cần khi trang web của bạn cần hỗ trợ Trình duyệt IE cũ 9 (trở xuống)
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        Viewport giúp trang web hiển thị tốt trên nhiều thiết bị nhỏ hơn:
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        Khai báo từ khóa, mô tả, tác giả:
        <meta name="keywords" content="HTML, CSS, JavaScript, Trungquandev" />
        <meta name="description" content="Trungquandev Web Tutorials" />
        <meta name="author" content="Trungquandev" />
    </head>
    <body></body>
</html>
