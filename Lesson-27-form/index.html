<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML Form</title>
    </head>
    <body>
        <form action="https://www.google.com/search" autocomplete="on" target="_blank" method="get">
            <label for="search">Keyword: </label><br />
            <input type="text" id="search" name="q" placeholder="Search Google..." />
            <button type="submit">Search</button>
        </form>
        <!-- Mục đích: gữi dữ liệu về server thông qua action -->
    </body>
</html>
