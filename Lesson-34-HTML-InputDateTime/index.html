<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>HTML Input DateTime</title>
    </head>
    <body>
        <form>
            <label>check booking date</label>
            <input type="date" name="booking-date" min="2025-08-03" max="2025-08-05" required /><br /><br />
            <label for="meeting-time">Choose a time for your meeting:</label>
            <input type="datetime-local" id="meeting-timee" name="meeting-time" value="2025-08-03T23:05" /><br /><br />
            <input type="submit" />
        </form>
    </body>
</html>
