<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Document</title>
    </head>
    <body>
        <!-- 
            type="url" >>> Định dạng URL.
            type="tel" >>> Cho nhập số điện thoại.
            type="range" >>> Thanh kéo chọn giá trị.
            type="search" >>> Input tìm kiếm.
            type="hidden" >>> Input ẩn, không hiển thị với người dùng.
            Tham khảo thêm nữa ở đây (recommended):
            https://developer.mozilla.org/en-US/docs/Learn_web_development/Extensions/Forms/HTML5_input_types   
        -->
        <details open>
            <summary>Chi tiết đơn hàng:</summary>
            <p>- Sản phẩm: Apple Magic Mouse 3 Black</p>
            <p>- Giá: 2.000.000 VNĐ</p>
            <p>- Ngày giao hàng: 01/08/2025</p>
        </details>
        <br /><br />

        <label>Đang tải dữ liệu...</label>
        <progress value="60" max="100"></progress>
        <br /><br />

        <label>Nhiệt độ CPU:</label>
        <meter value="30" min="0" max="100" low="50" high="80" optimum="60"></meter>
    </body>
</html>
