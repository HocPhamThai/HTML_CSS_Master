<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <!-- External Css -->
        <link rel="stylesheet" href="external_style.css" />
        <title>HTML CSS</title>
        <!-- Internal Css -->
        <style>
            p {
                color: blue;
                font-size: 20px;
                text-align: justify;
            }
        </style>
    </head>
    <body>
        <!-- Inline Css -->
        <h1 style="color: red; text-align: center">Hello CSS (style by Inline css)</h1>
        <p>Styling with CSS (style by Internal css)</p>
        <!-- Notes:
            - CSS (Cascading Style Sheets) is used to style HTML elements.
            - Syntax: selector { property: value; }
            - Basic Selectors:
            1. Element Selector: Selects all elements of a specific type (e.g., p, h1).
            2. Class Selector: Selects elements with a specific class attribute (e.g., .classname).
            3. ID Selector: Selects a single element with a specific id attribute (e.g., #idname).
            - CSS can be applied in three ways:
            1. Inline CSS: Using the style attribute within HTML elements.
            2. Internal CSS: Using a <style> tag within the <head> section.
            3. External CSS: Linking to an external .css file using the <link> tag. 
        -->
    </body>
</html>
