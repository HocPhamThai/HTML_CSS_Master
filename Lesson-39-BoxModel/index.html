<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CSS BoxModel</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }
            .box {
                width: 200px;
                height: 100px;
                background: lightgray;
                box-sizing: border-box;
                /* box-sizing: content-box; */
            }
            .p-30 {
                padding: 30px;
            }
            .border-10-solid-green {
                border: 10px solid green;
            }
            .m-20 {
                margin: 20px;
            }
        </style>
    </head>
    <body>
        <div class="box p-30">Padding</div>
        <div class="box border-10-solid-green">Border</div>
        <div class="box m-20">Margin</div>
        <!-- Notes:
         - The box-sizing property controls how the total width and height of an element are calculated.
            - box-sizing: border-box - width ,height = content + padding + border.
            - box-sizing: content-box (default) - width ,height = content.
         - Padding is the space between content - border.
         - Border is the space between padding - margin.
         - Margin is the space outside the border.
        -->
    </body>
</html>
