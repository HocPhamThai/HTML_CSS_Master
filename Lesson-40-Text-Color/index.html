<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Css Text-Color</title>
        <style>
            body {
                font-family: Arial, sans-serif;
                margin: 0;
                padding: 0;
            }

            h1 {
                background-color: #f4f4f4; /* Background Color */
                font-size: 30px; /* Font Size */
                font-family: "Courier New", Courier, monospace; /* Font Family */
                font-weight: bold; /* Font Weight */
                text-align: center; /* Text Alignment */
                text-transform: uppercase; /* Text Transform */
                line-height: 1.5; /* Line Height */

                color: yellowgreen; /* Text Color */
                color: rgb(0, 0, 255); /* Text Color using RGB*/
                color: rgb(0, 0, 255, 0.9); /* Text Color using RGB*/
                background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); /* Background Gradient */
                background: radial-gradient(circle, red, yellow);
            }
        </style>
    </head>
    <body>
        <h1>Hello Css 1</h1>
        <h1>Hello Css 2</h1>
        <h1>Hello Css 3</h1>
        <h1>Hello Css 4</h1>
        <h1>Hello Css 5</h1>
    </body>
</html>
