<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Position CSS</title>
        <style>
            .static {
                width: 250px;
                height: 100px;
                background: lightblue;
                position: static;
                top: 20px;
                left: 20px;
            }

            .relative {
                width: 250px;
                height: 100px;
                background: lightgreen;
                position: relative;
                top: 20px;
                left: 20px;
            }
            .absolute {
                width: 150px;
                height: 50px;
                background: lightcoral;
                position: absolute;
                top: 20px;
                left: 20px;
            }
            .fixed {
                width: 150px;
                height: 50px;
                background: lightseagreen;
                position: fixed;
                top: 0;
                right: 0;
            }
            .h-1500 {
                height: 1500px;
            }
            .sticky {
                width: 250px;
                height: 80px;
                background: lightsalmon;
                position: sticky;
                top: 0;
            }
        </style>
    </head>
    <body>
        <div class="static">Static Content</div>
        <div class="relative">Relative Content 01</div>
        <div class="relative">
            Relative Content 02
            <div class="absolute">Absolute Content 01 (follow relative)</div>
        </div>
        <div class="absolute">Absolute Content 02 (follow body)</div>
        <div class="fixed">Fixed Content (follow viewport)</div>
        <div class="sticky">Sticky Content</div>
        <div class="h-1500"></div>
    </body>
    <!-- Notes:
     - Với position: static, thuộc tính top, bottom, left, right không có tác dụng.
     - Với position: relative, phần tử vẫn vị trí ban đầu, dịch chuyển bằng top, bottom, left, right so với vị trí ban đầu.
     - Với position: absolute, phần tử được phụ thuộc vào cha gần nhất != static, if not thì phụ thuộc body.
     - Với position: fixed, phần tử được phụ thuộc vào viewport (cửa sổ trình duyệt), không di chuyển khi cuộn trang.
     - Với position: sticky, phần tử sẽ dính vào một vị trí xác định khi cuộn trang đến vị trí đó.
    -->
</html>
